[package]
name = "badges"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
axum = "0.8.4"
badgelib = { path = "../badgelib", features = ["axum"] }
cached = { version = "0.56.0", features = ["async"] }
chrono = { version = "0.4.41", features = ["serde"] }
dotenvy = "0.15.7"
maud = { version = "0.27.0", features = ["axum"] }
mime_guess = "2.0.5"
pulldown-cmark = "0.13.0"
regex = "1.11.2"
reqwest = { version = "0.12.23", features = ["json", "rustls-tls"], default-features = false }
rust-embed = { version = "8.7.2", features = ["axum"] }
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_variant = "0.1.3"
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["normalize-path", "trace"] }
tower-layer = "0.3.3"
tracing = "0.1.41"
tracing-logfmt = "0.3.5"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[lints.rust]
dead_code = "warn"
unused_imports = "warn"
