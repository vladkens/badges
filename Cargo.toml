[package]
name = "badges"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
badgelib = { version = "0.5.0", features = ["axum", "simple-icons"] }
cached = { version = "2.0.2", features = ["async"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
fastrand = "2.5.0"
maud = { version = "0.27.0", features = ["axum"] }
mime_guess = "2.0.5"
pulldown-cmark = "0.13.4"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "query", "rustls"], default-features = false }
rust-embed = { version = "8.12.0", features = ["axum"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_variant = "0.1.3"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["normalize-path", "trace"] }
tower-layer = "0.3.3"
tracing = "0.1.44"
tracing-logfmt = "0.3.7"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
dead_code = "warn"
unused_imports = "warn"

[profile.release]
strip = true

[profile.dev]
debug = 0
strip = "debuginfo"
